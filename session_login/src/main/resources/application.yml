spring:
  application:
    name: session_login
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: auth_user
    password: qwer1234!
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    throw-exception-if-no-handler-found: true
  mustache:
    suffix: .html
    servlet:
      cache: false
      expose-request-attributes: true
    charset: UTF-8

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true